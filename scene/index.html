<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
let L=document.getElementById('load');
if(!window.THREE){ L.textContent='3D 函式庫載入失敗, 請確認網路後重新整理'; return; }

const isTouch=window.matchMedia('(pointer: coarse)').matches;
const $=id=>document.getElementById(id);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const PI=Math.PI, clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
let seed=20261023;
const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
const rr=(a,b)=>a+(b-a)*rnd();
function hash(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function noise(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf); const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ return noise(x,y)*0.5+noise(x*2.1+5.3,y*2.1+1.7)*0.25+noise(x*4.3+9.1,y*4.3+3.3)*0.125; }
function hAt(x,z){ const d=Math.hypot(x,z); if(d<30) return 0; const k=Math.min(1,(d-30)/25); const rk=clamp((Math.abs(z+18)-6)/5,0,1); return ((fbm(x*0.045+3.1,z*0.045+7.2)-0.42)*3+(fbm(x*0.011+1,z*0.011+2)-0.4)*7*Math.min(1,(d-30)/50))*k*rk; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- renderer / scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.5:2));

scene.fog=new THREE.Fog(0xd8e6f2,60,240);
const camera=new THREE.PerspectiveCamera(70,1,0.05,700);
camera.rotation.order='YXZ';

/* ---------- textures (canvas generated) ---------- */
function tex(w,h,draw,rep,clampEdge){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=clampEdge?THREE.ClampToEdgeWrapping:THREE.RepeatWrapping; if(rep) t.repeat.set(rep[0],rep[1]); t.encoding=THREE.sRGBEncoding; t.anisotropy=Math.min(8,maxAniso); return t; }
const OFF=[[0,0],[-1,0],[0,-1],[-1,-1]];
const T={};
T.grass=tex(512,512,(g,w,h)=>{ g.fillStyle='#5e8a35'; g.fillRect(0,0,w,h); const cols=['#4a7a28','#6a9a3b','#7aa84a','#55822c','#8ab45c','#5f9036'];
  for(let i=0;i<5200;i++){ const x=rnd()*w,y=rnd()*h,l=4+rnd()*11,dx=(rnd()-0.5)*5; g.strokeStyle=cols[Math.floor(rnd()*cols.length)]; g.lineWidth=0.8+rnd()*1.2; for(const o of OFF){ g.beginPath(); g.moveTo(x+o[0]*w,y+o[1]*h); g.lineTo(x+o[0]*w+dx,y+o[1]*h-l); g.stroke(); } }
  for(let i=0;i<700;i++){ g.fillStyle='rgba(55,40,15,'+(0.06+rnd()*0.14).toFixed(2)+')'; g.beginPath(); g.arc(rnd()*w,rnd()*h,1+rnd()*3,0,2*PI); g.fill(); } },[64,64]);
T.gravel=tex(256,256,(g,w,h)=>{ g.fillStyle='#b3a88e'; g.fillRect(0,0,w,h); for(let i=0;i<1500;i++){ const x=rnd()*w,y=rnd()*h,r=1+rnd()*3,v=130+Math.floor(rnd()*95),ro=rnd()*PI; g.fillStyle='rgb('+v+','+(v-8)+','+(v-22)+')'; for(const o of OFF){ g.beginPath(); g.ellipse(x+o[0]*w,y+o[1]*h,r,r*0.7,ro,0,2*PI); g.fill(); } } },[6,6]);
T.dirt=tex(256,256,(g,w,h)=>{ g.fillStyle='#8f7a5e'; g.fillRect(0,0,w,h); for(let i=0;i<2500;i++){ const x=rnd()*w,y=rnd()*h,r=0.5+rnd()*2.2,v=95+Math.floor(rnd()*70); g.fillStyle='rgb('+(v+20)+','+v+','+(v-25)+')'; g.beginPath(); g.arc(x,y,r,0,2*PI); g.fill(); } for(let i=0;i<30;i++){ g.strokeStyle='rgba(60,45,25,0.22)'; g.lineWidth=2+rnd()*3; const y=rnd()*h; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); } },[34,2]);
T.weave=tex(64,64,(g,w,h)=>{ g.fillStyle='#ececec'; g.fillRect(0,0,w,h); for(let i=0;i<w;i+=2){ g.fillStyle=(i%4===0)?'#e0e0e0':'#f4f4f4'; g.fillRect(i,0,1,h);} for(let j=0;j<h;j+=2){ g.fillStyle='rgba(0,0,0,0.06)'; g.fillRect(0,j,w,1);} for(let i=0;i<300;i++){ g.fillStyle='rgba(0,0,0,'+(rnd()*0.05).toFixed(3)+')'; g.fillRect(rnd()*w,rnd()*h,2,2);} });
T.mesh=tex(32,32,(g,w,h)=>{ g.clearRect(0,0,w,h); g.fillStyle='rgba(35,35,38,0.95)'; for(let i=0;i<w;i+=4){ g.fillRect(i,0,1,h); g.fillRect(0,i,w,1); } });
T.wood=tex(256,256,(g,w,h)=>{ g.fillStyle='#9a7446'; g.fillRect(0,0,w,h); for(let i=0;i<120;i++){ g.strokeStyle='rgba(60,35,10,'+(0.08+rnd()*0.2).toFixed(2)+')'; g.lineWidth=1+rnd()*2; const y=rnd()*h; g.beginPath(); g.moveTo(0,y); g.bezierCurveTo(w/3,y+(rnd()-0.5)*20,2*w/3,y+(rnd()-0.5)*20,w,y); g.stroke(); } });
T.plateG=tex(512,352,(g,w,h)=>{ g.fillStyle='#3e4a3a'; g.fillRect(0,0,w,h); g.strokeStyle='#5a6655'; g.lineWidth=2; const hole=(x,y)=>{ g.beginPath(); g.arc(x,y,7,0,2*PI); g.fillStyle='#070708'; g.fill(); g.stroke(); }; for(let i=0;i<16;i++){ hole(28+i*30.4,22); hole(28+i*30.4,h-22); } for(let j=1;j<10;j++){ hole(22,22+j*30.8); hole(w-22,22+j*30.8); } g.fillStyle='#8a9a86'; g.font='bold 60px sans-serif'; g.fillText('05',w/2-40,h/2+20); },null,true);
T.plate=tex(512,352,(g,w,h)=>{ g.fillStyle='#141516'; g.fillRect(0,0,w,h); g.strokeStyle='#3a3c40'; g.lineWidth=2; const hole=(x,y)=>{ g.beginPath(); g.arc(x,y,7,0,2*PI); g.fillStyle='#070708'; g.fill(); g.stroke(); }; for(let i=0;i<16;i++){ hole(28+i*30.4,22); hole(28+i*30.4,h-22); } for(let j=1;j<10;j++){ hole(22,22+j*30.8); hole(w-22,22+j*30.8); } },null,true);
T.waffle=tex(64,64,(g,w,h)=>{ g.fillStyle='#3a3e46'; g.fillRect(0,0,w,h); g.fillStyle='#474c55'; for(let i=0;i<w;i+=8) for(let j=0;j<h;j+=8) g.fillRect(i+1,j+1,6,6); });
T.tuft=tex(64,64,(g,w,h)=>{ g.clearRect(0,0,w,h); const cs=['#4f8a2c','#6fa544','#86b957','#5f9a36']; for(let i=0;i<10;i++){ const x=8+rnd()*48; g.strokeStyle=cs[i%4]; g.lineWidth=2.2; g.beginPath(); g.moveTo(x,h); g.quadraticCurveTo(x+(rnd()-0.5)*18,h*0.5,x+(rnd()-0.5)*26,6+rnd()*18); g.stroke(); } },null,true);
T.glow=tex(128,128,(g,w,h)=>{ g.clearRect(0,0,w,h); const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.22,'rgba(255,250,225,0.95)'); gr.addColorStop(0.5,'rgba(255,232,170,0.35)'); gr.addColorStop(1,'rgba(255,220,120,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h); },null,true);
T.moon=tex(128,128,(g,w,h)=>{ g.clearRect(0,0,w,h); const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(240,240,232,1)'); gr.addColorStop(0.55,'rgba(230,230,220,1)'); gr.addColorStop(0.6,'rgba(230,230,220,0.35)'); gr.addColorStop(1,'rgba(200,210,230,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h); g.fillStyle='rgba(180,180,175,0.5)'; [[48,50,9],[72,78,7],[80,44,5]].forEach(c=>{ g.beginPath(); g.arc(c[0],c[1],c[2],0,2*PI); g.fill(); }); },null,true);
T.cloud=tex(256,128,(g,w,h)=>{ g.clearRect(0,0,w,h); for(let i=0;i<16;i++){ const x=35+rnd()*(w-70),y=40+rnd()*(h-70),r=22+rnd()*32; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(255,255,255,0.85)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r); } },null,true);
const CJK='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif';
function labelTex(text,w,h,bg,fg,px){ return tex(w,h,(g)=>{ g.fillStyle=bg; g.fillRect(0,0,w,h); g.fillStyle=fg; g.font='bold '+px+'px '+CJK; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,w/2,h/2+px*0.06); },null,true); }

/* ---------- materials (hex given as sRGB, converted to linear for r128) ---------- */

const M={

 sandIn:std({color:0x1c1c1c,roughness:1,side:THREE.BackSide}),

  if(ptr.size>=2){ const a=[...ptr.values()]; const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); if(pinchPrev!==null&&mode==='orbit'){ orbGoal.dist=clamp(orbGoal.dist*pinchPrev/Math.max(1,d),1.5,60); orb.dist=orbGoal.dist; } pinchPrev=d; return; }
  const k=isTouch?0.0045:0.0032;
  if(mode==='walk'){ yaw+=dx*k; pitch=clamp(pitch+dy*k,-1.35,1.35); yawGoal=yaw; pitchGoal=pitch; }
  else { orbGoal.yaw-=dx*k; orbGoal.pitch=clamp(orbGoal.pitch+dy*k,0.05,1.5); orb.yaw=orbGoal.yaw; orb.pitch=orbGoal.pitch; } });
function up(e){ const p=ptr.get(e.pointerId); if(!p) return; ptr.delete(e.pointerId); pinchPrev=null; if(ptr.size===0&&p.moved<10&&performance.now()-p.t0<600) tap(e.clientX,e.clientY); }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); if(mode==='orbit'){ orbGoal.dist=clamp(orbGoal.dist*(1+Math.sign(e.deltaY)*0.1),1.5,60); } else { posGoal.addScaledVector(V(-Math.sin(yaw),0,-Math.cos(yaw)),-Math.sign(e.deltaY)*0.6); } },{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2(); const groundSet=[ground,pad,drive,road];
const ring=new THREE.Mesh(new THREE.RingGeometry(0.16,0.24,32),new THREE.MeshBasicMaterial({color:0xffc83c,transparent:true,opacity:0,depthWrite:false})); ring.rotation.x=-PI/2; ring.visible=false; scene.add(ring); let ringT=0;
function tap(cx,cy){ ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera); const hits=ray.intersectObjects(site.children.concat(groundSet),true); for(const h of hits){ let o=h.object; let vis=true; for(let q=h.object;q;q=q.parent){ if(q.visible===false){ vis=false; break; } } if(!vis) continue; while(o&&!o.userData.gear) o=o.parent; if(o){ focus(o.userData.gear); return; } if(groundSet.indexOf(h.object)>=0){ walkTo(h.point); return; } } }
function walkTo(pt){ if(blocked(pt.x,pt.z)) return; ring.position.set(pt.x,hAt(pt.x,pt.z)+0.03,pt.z); ring.visible=true; ring.scale.setScalar(1); ring.material.opacity=1; ringT=performance.now(); if(mode==='orbit'){ orbGoal.target.set(pt.x,0.8,pt.z); } else { posGoal.set(pt.x,EYE,pt.z); } }
function lookGoal(c,from){ const dx=c.x-from.x,dz=c.z-from.z; yawGoal=Math.atan2(-dx,-dz); pitchGoal=Math.atan2(Math.min(c.y,1.4)-from.y,Math.hypot(dx,dz)); }
function focus(info){ const b=new THREE.Box3().setFromObject(info.obj); const c=b.getCenter(new THREE.Vector3()); const s=b.getSize(new THREE.Vector3());
  const under=c.y<2.0&&Math.max(s.x,s.y,s.z)<2.5&&((c.x>1.2&&c.x<8.6&&c.z>-5.2&&c.z<0.7)||(Math.abs(c.x)<1.3&&c.z>-4.2&&c.z<-0.3)); // 雲界/拓展天幕下或車尾帳內的小物件: 環繞鏡頭會卡在布面, 改步行視角
  if((info.inside||under)&&mode==='orbit') setMode('walk',false);
  if(mode==='orbit'){ orbGoal.target.copy(c); orbGoal.dist=clamp(Math.max(s.x,s.y,s.z)*1.3+0.9,1.8,40); orbGoal.pitch=clamp(orbGoal.pitch,0.12,1.2); autoSpin=false; }
  else { const dir=(info.view||V(0,0,1)).clone().setY(0).normalize(); const r=info.dist||(Math.max(s.x,s.z)*0.55+1.4); posGoal.copy(c).addScaledVector(dir,r); posGoal.y=EYE; lookGoal(c,posGoal); }
  showCard(info); $('list').hidden=true; }
let helper=null,helperT=0;
function flash(obj){ if(helper){ scene.remove(helper); helper=null; } const b=new THREE.Box3().setFromObject(obj); helper=new THREE.Box3Helper(b,0xffc83c); helper.userData.info=obj.userData.gear; scene.add(helper); helperT=performance.now(); }
function statusShort(s){ return (s||'').split(' ')[0].replace(/[(,].*$/,''); }
function showCard(info){ $('cName').textContent=info.name; $('cBody').innerHTML='<div><span class="k">尺寸: </span>'+esc(info.dim||'-')+'</div>'; $('card').hidden=false; flash(info.obj); }
$('cardX').onclick=()=>{ $('card').hidden=true; };
function setVisible(info,v){ info.obj.visible=v; if(info.row) info.row.classList.toggle('off',!v); if(info.hb) info.hb.textContent=v?'隱藏':'顯示'; if(!v&&helper&&helper.userData.info===info){ scene.remove(helper); helper=null; } }
function buildList(){ const el=$('items'); let cat=''; const order=['帳篷系統','睡眠','桌椅推車','電力照明','廚房食物','其他','車輛','營地設施']; GEAR.slice().sort((a,b)=>order.indexOf(a.cat)-order.indexOf(b.cat)).forEach(info=>{ if(info.cat!==cat){ cat=info.cat; const h=document.createElement('div'); h.className='grp'; h.textContent=cat; el.appendChild(h); } const row=document.createElement('div'); row.className='item'; const b=document.createElement('button'); b.type='button'; b.className='nm'; b.innerHTML='<span>'+esc(info.name)+'</span><span class="st">'+esc(info.dim||'')+'</span>'; b.onclick=()=>{ if(!info.obj.visible) setVisible(info,true); focus(info); }; const hb=document.createElement('button'); hb.type='button'; hb.className='hd'; hb.textContent='隱藏'; hb.onclick=()=>setVisible(info,!info.obj.visible); row.appendChild(b); row.appendChild(hb); info.row=row; info.hb=hb; el.appendChild(row); }); }
$('showAll').onclick=()=>{ GEAR.forEach(info=>setVisible(info,true)); };
buildList();
GEAR.forEach(info=>{ if(/預設隱藏/.test(info.name)) setVisible(info,false); });
$('bList').onclick=()=>{ $('list').hidden=!$('list').hidden; };
$('listX').onclick=()=>{ $('list').hidden=true; };
const VIEWS={'全景':{mode:'orbit',target:[2.6,0.8,-2.6],yaw:0.9,pitch:0.5,dist:19},'客廳':{mode:'walk',pos:[7.3,EYE,0.4],look:[5.2,0.8,-2.3]},'門口':{mode:'walk',pos:[3.9,EYE,-2.3],look:[0.8,1.0,-2.6]},'帳內':{mode:'walk',pos:[0.6,1.4,-0.75],look:[-0.3,0.4,-3.2]},'車尾':{mode:'walk',pos:[-2.8,EYE,-6.0],look:[0,1.0,-3.4]}};
function gotoView(name){ const v=VIEWS[name]; if(!v) return; if(v.mode==='orbit'){ setMode('orbit',false); orbGoal.target.set(v.target[0],v.target[1],v.target[2]); orbGoal.yaw=v.yaw; orbGoal.pitch=v.pitch; orbGoal.dist=v.dist; autoSpin=true; } else { setMode('walk',false); posGoal.set(v.pos[0],v.pos[1],v.pos[2]); lookGoal(V(v.look[0],v.look[1],v.look[2]),posGoal); } $('card').hidden=true; }
document.querySelectorAll('#views .chip').forEach(b=>{ b.onclick=()=>gotoView(b.dataset.v); });
function setMode(m,place){ if(mode===m){ updateUI(); return; } mode=m;
  if(m==='walk'){ if(place!==false){ const cp=camera.position,t=orb.target; posGoal.set(cp.x,EYE,cp.z); if(blocked(posGoal.x,posGoal.z)||Math.hypot(posGoal.x,posGoal.z)>80){ const d=V(cp.x-t.x,0,cp.z-t.z).normalize(); posGoal.set(t.x+d.x*3.5,EYE,t.z+d.z*3.5); } pos.copy(posGoal); lookGoal(V(t.x,1.0,t.z),pos); yaw=yawGoal; pitch=pitchGoal; } }
  else { if(place!==false){ const t=pos.clone().addScaledVector(V(-Math.sin(yaw),0,-Math.cos(yaw)),4); t.y=0.8; orb.target.copy(t); orbGoal.target.copy(t); orb.yaw=orbGoal.yaw=yaw; orb.pitch=orbGoal.pitch=Math.max(0.25,pitch+0.3); orb.dist=orbGoal.dist=5; } autoSpin=false; }
  updateUI(); }
function toggleMode(){ setMode(mode==='orbit'?'walk':'orbit',true); }
function toggleNight(){ nightGoal=nightGoal?0:1; $('bNight').textContent=nightGoal?'白天':'夜晚'; $('bNight').classList.toggle('on',!!nightGoal); updateUI(); }
function updateUI(){ $('bMode').textContent=mode==='orbit'?'步行':'環繞'; $('bMode').classList.toggle('on',mode==='walk'); $('cross').hidden=mode!=='walk'; $('hint').textContent=mode==='orbit'?'拖曳旋轉, 雙指/滾輪縮放, 點物件看規格, 點地面把中心移過去':(isTouch?'拖曳轉頭, 點地面走過去, 點物件看規格':'拖曳轉頭, 點地面走過去, W A S D 移動, 點物件看規格'); $('stat').textContent=(mode==='orbit'?'環繞視角':'步行視角')+' · '+(nightGoal?'夜晚':'白天'); }
$('bNight').onclick=toggleNight; $('bMode').onclick=toggleMode; updateUI();

const BLOCKS=[[-1.3,1.3,-8.95,-3.5],[-29.7,-22.3,12.2,15.8],[9.9,11.1,-3.5,-2.5]];
function blocked(x,z){ return BLOCKS.some(b=>x>b[0]&&x<b[1]&&z>b[2]&&z<b[3]); }
function wrapA(a){ return Math.atan2(Math.sin(a),Math.cos(a)); }
const fanAnim=fan.userData.anim;
function update(dt,t){
 if(nightT!==nightGoal){ nightT=clamp(nightT+(nightGoal>nightT?1:-1)*dt/1.4,0,1); applyNight(nightT); }
 M.bulb.forEach((m,i)=>{ m.emissiveIntensity=lerp(0.15,2.2*(0.85+0.15*Math.sin(t*3+i*2.1)),nightT); });
 const sm=1-Math.exp(-dt*5);
 if(mode==='walk'){
   let vx=0,vz=0; if(keys.KeyW||keys.ArrowUp) vz-=1; if(keys.KeyS||keys.ArrowDown) vz+=1; if(keys.KeyA||keys.ArrowLeft) vx-=1; if(keys.KeyD||keys.ArrowRight) vx+=1; const l=Math.hypot(vx,vz);
   if(l>0.02){ if(l>1){ vx/=l; vz/=l; } const sp=(keys.ShiftLeft||keys.ShiftRight)?5.2:2.6; const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw); posGoal.x+=(fx*-vz+rx*vx)*sp*dt; posGoal.z+=(fz*-vz+rz*vx)*sp*dt; }
   const dx=posGoal.x-pos.x,dz=posGoal.z-pos.z,d=Math.hypot(dx,dz);
   if(d>0.001){ const v=Math.max(2.6,d*3)*dt; const k=Math.min(1,v/d); const nx=pos.x+dx*k,nz=pos.z+dz*k; let moved=false; if(!blocked(nx,pos.z)){ pos.x=nx; moved=true; } if(!blocked(pos.x,nz)){ pos.z=nz; moved=true; } if(!moved) posGoal.set(pos.x,posGoal.y,pos.z); }
   const R=90,dd=Math.hypot(pos.x,pos.z); if(dd>R){ pos.x*=R/dd; pos.z*=R/dd; posGoal.set(pos.x,posGoal.y,pos.z); }
   pos.y=hAt(pos.x,pos.z)+posGoal.y;
   yaw+=wrapA(yawGoal-yaw)*sm; pitch+=(pitchGoal-pitch)*sm;
   camera.position.copy(pos); camera.rotation.set(pitch,yaw,0);
 } else {
   if(autoSpin){ orbGoal.yaw+=dt*0.07; orb.yaw=orbGoal.yaw; }
   if(keys.ArrowLeft){ orbGoal.yaw+=dt*1.2; orb.yaw=orbGoal.yaw; } if(keys.ArrowRight){ orbGoal.yaw-=dt*1.2; orb.yaw=orbGoal.yaw; } if(keys.ArrowUp){ orbGoal.dist=clamp(orbGoal.dist*(1-dt),1.5,60); } if(keys.ArrowDown){ orbGoal.dist=clamp(orbGoal.dist*(1+dt),1.5,60); }
   orb.yaw+=wrapA(orbGoal.yaw-orb.yaw)*sm; orb.pitch+=(orbGoal.pitch-orb.pitch)*sm; orb.dist+=(orbGoal.dist-orb.dist)*sm; orb.target.lerp(orbGoal.target,sm);
   const cp=orb.pitch; const cx=orb.target.x+Math.sin(orb.yaw)*Math.cos(cp)*orb.dist, cz=orb.target.z+Math.cos(orb.yaw)*Math.cos(cp)*orb.dist; camera.position.set(cx,Math.max(orb.target.y+Math.sin(cp)*orb.dist,hAt(cx,cz)+0.4),cz); camera.lookAt(orb.target);
 }
 fanAnim.blades.rotation.z+=dt*22; fanAnim.head.rotation.y=Math.sin(t*0.7)*0.55;
 clouds.forEach(c=>{ c.position.x+=c.userData.v*dt; if(c.position.x>250) c.position.x=-250; });
 if(helper&&performance.now()-helperT>1800){ scene.remove(helper); helper=null; }
 if(ring.visible){ const a=1-(performance.now()-ringT)/1200; if(a<=0) ring.visible=false; else { ring.material.opacity=a; ring.scale.setScalar(1+(1-a)*1.6); } }
}
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
let last=performance.now(),tt=0;
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(0.5,(now-last)/1000); last=now; tt+=dt; update(dt,tt); renderer.render(scene,camera); if(L){ L.remove(); L=null; } }
requestAnimationFrame(loop);
})();
